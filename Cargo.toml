[workspace]
resolver = "2"
members = [
    "crates/utils",
    "crates/crypto",
    "crates/discovery",
    "crates/file",
    "crates/transfer",
    "crates/task",
    "crates/ffi",
    "tools/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["LocalTransfer Team"]
repository = "local"

[workspace.dependencies]
# ---- internal crates ----
utils = { path = "crates/utils" }
crypto = { path = "crates/crypto" }
discovery = { path = "crates/discovery" }
file = { path = "crates/file" }
transfer = { path = "crates/transfer" }
task = { path = "crates/task" }

# ---- async runtime ----
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# ---- transport / tls ----
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
ring = "0.17"
rcgen = "0.14.9"
time = "0.3"

# ---- hashing ----
blake3 = { version = "1", features = ["rayon"] }

# ---- discovery ----
mdns-sd = "0.21.0"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

# ---- file ----
memmap2 = "0.9"

# ---- serialization / misc ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
rand = "0.10.2"
hex = "0.4"
dirs = "6.0.0"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
