[package]
name = "lt-ffi"
description = "LocalTransfer 统一 C 风格 FFI（lt_* 接口，cbindgen 生成 lt_api.h）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lt-utils = { workspace = true }
lt-crypto = { workspace = true }
lt-discovery = { workspace = true }
lt-file = { workspace = true }
lt-transfer = { workspace = true }
lt-task = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
once_cell = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cbindgen = "0.27"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
