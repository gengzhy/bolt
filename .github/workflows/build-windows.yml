name: Build Windows Dist

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Packages (Portable, Setup, MSI, CLI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: tauri_app/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Frontend Dependencies
        working-directory: tauri_app
        run: npm install

      - name: Build All Windows Packages
        shell: powershell
        run: powershell.exe -ExecutionPolicy Bypass -File scripts\build_windows_dist.ps1 -Mode release

      - name: Upload Windows Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bolt-windows-dist
          path: dist/**
          if-no-files-found: warn

      - name: Upload Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: bolt-windows-portable
          path: dist/release/bolt-*-windows-*-portable.zip
          if-no-files-found: warn

      - name: Upload NSIS Setup
        uses: actions/upload-artifact@v4
        with:
          name: bolt-windows-setup
          path: dist/release/bolt-*-windows-*-setup.exe
          if-no-files-found: warn

      - name: Upload WiX MSI
        uses: actions/upload-artifact@v4
        with:
          name: bolt-windows-msi
          path: dist/release/bolt-*-windows-*.msi
          if-no-files-found: warn

      - name: Upload Windows CLI Zip
        uses: actions/upload-artifact@v4
        with:
          name: bolt-windows-cli
          path: dist/release/bolt-cli-*-windows-*.zip
          if-no-files-found: warn
