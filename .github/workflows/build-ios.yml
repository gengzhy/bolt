name: Build iOS Dist

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS App & XCFramework (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (iOS Targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build iOS Rust XCFramework
        run: bash scripts/build_ios_lib.sh release

      - name: Build iOS Archive & Package IPA
        run: bash scripts/build_ios_dist.sh -m release

      - name: Upload iOS Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bolt-ios-dist
          path: dist/ios/**
          if-no-files-found: warn

      - name: Upload Bolt IPA (Sideload Installable)
        uses: actions/upload-artifact@v4
        with:
          name: bolt-ios-ipa
          path: dist/ios/release/*.ipa
          if-no-files-found: error

      - name: Upload BoltEngine.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: bolt-engine-xcframework
          path: ios_app/Frameworks/BoltEngine.xcframework
          if-no-files-found: error

      - name: Upload Bolt.xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: bolt-ios-xcarchive
          path: dist/ios/release/Bolt.xcarchive
          if-no-files-found: warn
